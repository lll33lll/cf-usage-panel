name: bootstrap

# 一次性工作流：把项目文件拉进仓库（推送完成后本文件会被删除）
on:
  push:
    paths:
      - '.github/workflows/bootstrap.yml'

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Download and verify
        run: |
          set -euo pipefail
          curl -fsSL --retry 5 --retry-all-errors -o /tmp/p.tar.gz \
            'https://tmp-repo-push2.abc1221.ccwu.cc/f/project.tar.gz'
          echo "42febcaab5de633a9601018b185c28ed430a16d2ae682aa11b3d77cc53238c79  /tmp/p.tar.gz" | sha256sum -c -
          tar xzf /tmp/p.tar.gz -C .

      - name: Commit and push
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "feat: 初始化 cf-usage-panel"
          git push
