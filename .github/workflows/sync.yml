name: sync

# 一次性工作流：同步项目文件与截图（完成后本文件会被删除）
on:
  push:
    paths:
      - '.github/workflows/sync.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Download and verify
        run: |
          set -euo pipefail
          curl -fsSL --retry 5 --retry-all-errors -o /tmp/p.tar.gz \
            'https://tmp-blue.abc1221.ccwu.cc/f/project.tar.gz'
          echo "6f447e821bc59fa4157b25c730f23e52d2d86cb570dc56fbfe14aff78faee59b  /tmp/p.tar.gz" | sha256sum -c -
          tar xzf /tmp/p.tar.gz -C .

      - name: Commit and push
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "style: 交互元素与用量条改用 Cloudflare 蓝，橙色保留给品牌与图表"
          git push
