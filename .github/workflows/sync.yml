name: sync

# 一次性工作流：把项目文件同步进仓库（推送完成后本文件会被删除）
on:
  push:
    paths:
      - '.github/workflows/sync.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Download and verify
        run: |
          set -euo pipefail
          curl -fsSL --retry 5 --retry-all-errors -o /tmp/p.tar.gz \
            'https://tmp-final.abc1221.ccwu.cc/f/project.tar.gz'
          echo "bfba96f4cbfe53949d988a15f6c2946956a4861af15f57c55a32946ce6809ec0  /tmp/p.tar.gz" | sha256sum -c -
          tar xzf /tmp/p.tar.gz -C .

      - name: Commit and push
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "feat: 左上角改用 Cloudflare 官方 logo"
          git push
