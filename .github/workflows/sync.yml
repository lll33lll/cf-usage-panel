name: sync

# 一次性工作流：同步项目文件与截图（完成后本文件会被删除）
on:
  push:
    paths:
      - '.github/workflows/sync.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Download and verify
        run: |
          set -euo pipefail
          curl -fsSL --retry 5 --retry-all-errors -o /tmp/p.tar.gz \
            'https://tmp-ax.abc1221.ccwu.cc/f/project2.tar.gz'
          echo "422a83057bfe16c06b6f3e665448ce98677f583523095563c1def1d83d22382b  /tmp/p.tar.gz" | sha256sum -c -
          tar xzf /tmp/p.tar.gz -C .

      - name: Commit and push
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "fix: 趋势图 X 轴补上末尾的次日 08:00；账号对比显示今日请求上限"
          git push
